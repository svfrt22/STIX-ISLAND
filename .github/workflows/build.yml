name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          chmod +x scripts/build-app.sh
          VERSION="0.1.${{ github.run_number }}" BUILD_NUMBER="${{ github.run_number }}" ./scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: STIX-Island
          path: dist/*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" dist/*.zip \
            --title "STIX Island 0.1.${{ github.run_number }}" \
            --notes "Automatic build from ${{ github.sha }}" \
            --latest
